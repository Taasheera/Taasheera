server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # CloudFront supplies this header; clients cannot bypass the distribution.
    if ($http_x_taasheera_origin != "${ORIGIN_TOKEN}") { return 403; }
    # Do not record request URLs: reset links and uploaded data are sensitive.
    access_log off;
    client_max_body_size 11m;

    location ~ ^/(auth|passports|profile|sessions|activity|assistant|applications|features|notifications|visa-guides|vault|support|help-content|health)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite client input with CloudFront's generated viewer address.
        proxy_set_header X-Taasheera-Client-IP $http_cloudfront_viewer_address;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_request_buffering on;
    }

    # Dashboard pages use /admin, so the browser reaches the admin API under /admin-api.
    location /admin-api/ {
        proxy_pass http://api:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Taasheera-Client-IP $http_cloudfront_viewer_address;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Pages and built files only, never API responses (CMPS271-137). CloudFront's CachingDisabled
    # policy does not compress, and it adds a Via header, so nginx compresses proxied requests itself.
    location / {
        gzip on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # Built file names change with their content, so browsers keep them for a year.
        # A missing one is a 404: falling back to index.html would keep the page as that file.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
