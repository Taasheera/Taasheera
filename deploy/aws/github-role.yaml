AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC role for redeploying an existing Taasheera host (manual dev, automatic main).
Parameters:
  AppStackName:
    Type: String
    Default: taasheera
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false if token.actions.githubusercontent.com already exists in IAM.
  TrustedSubject:
    Type: String
    Default: repo:Taasheera@357495043/Taasheera@1387089236:ref:refs/heads/dev
    AllowedValues:
      - repo:Taasheera@357495043/Taasheera@1387089236:ref:refs/heads/dev
      - repo:Taasheera@357495043/Taasheera@1387089236:environment:production
    Description: >-
      Deploy once for the dev branch and once for the production environment.
      GitHub uses the immutable subject after the repository transfer.
Conditions:
  NewProvider: !Equals [!Ref CreateOidcProvider, 'true']
  ProductionDeploy: !Equals
    - !Ref TrustedSubject
    - 'repo:Taasheera@357495043/Taasheera@1387089236:environment:production'
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: NewProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [NewProvider, !Ref Provider, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com']
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref TrustedSubject
      Policies:
        - PolicyName: RedeployExistingHost
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
              - Effect: Allow
                Action: [ssm:ListCommandInvocations, ssm:GetCommandInvocation]
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    ssm:resourceTag/aws:cloudformation:stack-name: !Ref AppStackName
      Tags:
        - {Key: OwnerEmail, Value: mhs86@mail.aub.edu}
  PublishImages:
    Type: AWS::IAM::Policy
    Condition: ProductionDeploy
    Properties:
      PolicyName: PublishEc2ReleaseImages
      Roles: [!Ref DeployRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:BatchGetImage
            Resource:
              - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/taasheera-ec2-api'
              - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/taasheera-ec2-web'
Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
