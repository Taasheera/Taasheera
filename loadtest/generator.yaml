AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Temporary k6 load generator for the Sprint 5 capacity tests, in the same region as staging so the
  numbers measure the server rather than a home connection. No inbound ports (Systems Manager only).
  Delete the stack when the tests are done: bash loadtest/generator.sh delete
Parameters:
  OwnerEmail:
    Type: String
    Default: mhs86@mail.aub.edu
    AllowedValues: [mhs86@mail.aub.edu]
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  VpcId:
    Type: AWS::EC2::VPC::Id
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    # The account's AWS Free plan allows free-tier-eligible types only; c7i-flex.large has 4 GiB for k6.
    Default: c7i-flex.large
    AllowedValues: [c7i-flex.large, t3.small]
Conditions:
  Burstable: !Equals [!Ref InstanceType, t3.small]
Resources:
  GeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        # capacity.py reads staging's CPU and CPU credits for each step.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchReadOnlyAccess
  GeneratorProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref GeneratorRole]
  GeneratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load generator; outbound only, administration through SSM.
      VpcId: !Ref VpcId
  Generator:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref GeneratorProfile
      CreditSpecification: !If [Burstable, {CPUCredits: unlimited}, !Ref 'AWS::NoValue']
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref GeneratorSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: taasheera-loadgen}
        - {Key: OwnerEmail, Value: !Ref OwnerEmail}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y git python3
          dnf install -y https://dl.k6.io/rpm/repo.rpm
          dnf install -y k6
          printf '* soft nofile 65536\n* hard nofile 65536\n' > /etc/security/limits.d/k6.conf
Outputs:
  InstanceId:
    Value: !Ref Generator
  PublicIp:
    Value: !GetAtt Generator.PublicIp
